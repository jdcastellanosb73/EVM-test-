name: evm-tracker

x-postgres: &postgres
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evm}
      POSTGRES_USER: ${POSTGRES_USER:-evm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evm}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - evm-data:/var/lib/postgresql/data
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evm}:${POSTGRES_PASSWORD:-evm}@db:5432/${POSTGRES_DB:-evm}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-test:
    <<: *postgres
    profiles: ["test"]
    environment:
      POSTGRES_DB: evm_test
      POSTGRES_USER: evm
      POSTGRES_PASSWORD: evm
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  evm-data:
